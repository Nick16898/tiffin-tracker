<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tiffin & Meal Tracker</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --surface: #1a243b;
      --surface-hover: #23304e;
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #38bdf8;
      --amber: #fbbf24;
      --pink: #f43f5e;
      --emerald: #34d399;
      --purple: #c084fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 700;
    }

    .server-status {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
    }

    .status-dot.online {
      background: var(--emerald);
    }

    .rate-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rate-box span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .rate-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--cyan);
      font-size: 14px;
      font-weight: 700;
      width: 45px;
      text-align: center;
    }

    .rate-box button {
      background: var(--cyan);
      color: #0b0f19;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .kpi-golu {
      grid-column: span 2;
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.12), rgba(192, 132, 252, 0.12));
      border: 1px solid rgba(244, 63, 94, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-lbl {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .kpi-val {
      font-size: 18px;
      font-weight: 800;
    }

    .cal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .month-switch {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .month-title {
      font-size: 16px;
      font-weight: 700;
    }

    .today-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .week-row, .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
    }

    .week-day {
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      padding-bottom: 4px;
    }

    .day-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 56px;
      padding: 4px 3px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .day-cell:active, .day-cell.selected {
      border-color: var(--cyan);
      background: var(--surface-hover);
    }

    .day-cell.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .day-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      line-height: 1;
    }

    .day-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .day-cost {
      font-size: 9px;
      font-weight: 700;
      color: var(--emerald);
    }

    .dots-row {
      display: flex;
      flex-wrap: wrap;
      gap: 2.5px;
      margin-top: 2px;
      align-content: flex-end;
    }

    .dot-pill {
      font-size: 8px;
      font-weight: 700;
      padding: 1.5px 3px;
      border-radius: 3px;
      line-height: 1;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .dot-l {
      background: rgba(56, 189, 248, 0.2);
      color: var(--cyan);
    }

    .dot-d {
      background: rgba(251, 191, 36, 0.2);
      color: var(--amber);
    }

    .dot-x {
      background: rgba(244, 63, 94, 0.2);
      color: var(--pink);
    }

    .dot-golu {
      background: rgba(244, 63, 94, 0.35);
      color: #ffb3c6;
    }

    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-overlay.active {
      display: flex;
    }

    .sheet {
      background: #111827;
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      padding: 20px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
      animation: slideUp 0.2s ease-out;
      max-height: 88vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 700;
    }

    .close-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .switch-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .toggle-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 12px 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
    }

    .toggle-card.active-l {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .toggle-card.active-d {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--amber);
      color: var(--amber);
    }

    .field-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-box label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .field-box input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      width: 100%;
    }

    .field-box input:focus {
      border-color: var(--cyan);
    }

    .extras-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 10px;
    }

    .extras-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .extras-header span {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .btn-add-item {
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .extras-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .extra-row {
      display: grid;
      grid-template-columns: 1fr 70px 65px 28px;
      gap: 5px;
      align-items: center;
    }

    .extra-row input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
      width: 100%;
    }

    .extra-row input:focus {
      border-color: var(--cyan);
    }

    .btn-golu-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      user-select: none;
      white-space: nowrap;
    }

    .btn-golu-toggle.active {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--pink);
      color: #fda4af;
    }

    .btn-remove-row {
      background: rgba(244, 63, 94, 0.15);
      color: var(--pink);
      border: 1px solid rgba(244, 63, 94, 0.3);
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .sheet-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-clear {
      flex: 1;
      background: rgba(244, 63, 94, 0.15);
      color: var(--pink);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save {
      flex: 2;
      background: var(--cyan);
      color: #0b0f19;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <div class="top-header">
      <div class="brand">
        <h1>Tiffin Tracker</h1>
        <div class="server-status">
          <span class="status-dot" id="serverDot"></span>
          <span id="serverText">Connecting server...</span>
        </div>
      </div>

      <div class="rate-box">
        <span>₹/meal:</span>
        <input type="number" id="masterRate" min="0" />
        <button onclick="saveMasterRate()">Save</button>
      </div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-lbl">Month Tiffin</div>
      <div class="kpi-val" style="color: var(--cyan);" id="kpiTiffinCost">₹0</div>
    </div>
    <div class="kpi">
      <div class="kpi-lbl">Tiffins Count</div>
      <div class="kpi-val" id="kpiCount">0</div>
    </div>
    <div class="kpi">
      <div class="kpi-lbl">Extra Snacks</div>
      <div class="kpi-val" style="color: var(--pink);" id="kpiExtras">₹0</div>
    </div>
    <div class="kpi">
      <div class="kpi-lbl">Total Spend</div>
      <div class="kpi-val" style="color: var(--amber);" id="kpiTotal">₹0</div>
    </div>
    <div class="kpi kpi-golu">
      <div>
        <div class="kpi-lbl" style="color: #fda4af;">Spent with Golu</div>
        <div style="font-size: 11px; color: var(--text-muted);">Golu's portion in extras</div>
      </div>
      <div class="kpi-val" style="color: #fb7185;" id="kpiGolu">₹0</div>
    </div>
  </div>

  <div class="card">
    <div class="cal-nav">
      <div class="month-switch">
        <button class="nav-btn" onclick="changeMonth(-1)">&lsaquo;</button>
        <span class="month-title" id="monthTitle">--</span>
        <button class="nav-btn" onclick="changeMonth(1)">&rsaquo;</button>
      </div>
      <button class="today-btn" onclick="resetToday()">Today</button>
    </div>

    <div class="week-row">
      <div class="week-day">S</div>
      <div class="week-day">M</div>
      <div class="week-day">T</div>
      <div class="week-day">W</div>
      <div class="week-day">T</div>
      <div class="week-day">F</div>
      <div class="week-day">S</div>
    </div>

    <div class="days-grid" id="daysGrid"></div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="overlayClick(event)">
  <div class="sheet" id="sheetModal">
    <div class="sheet-top">
      <span class="sheet-title" id="sheetDateLabel">Date</span>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>

    <div class="switch-row">
      <div class="toggle-card" id="btnLunch" onclick="toggleLunch()">Lunch: OFF</div>
      <div class="toggle-card" id="btnDinner" onclick="toggleDinner()">Dinner: OFF</div>
    </div>

    <div class="field-box">
      <label>Rate Override (₹)</label>
      <input type="number" id="inputRate" placeholder="Default ₹" />
    </div>

    <div class="extras-section">
      <div class="extras-header">
        <span>Extra Items</span>
        <button type="button" class="btn-add-item" onclick="addExtraRow()">+ Add Item</button>
      </div>
      <div class="extras-list" id="extrasList"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn-clear" onclick="clearEntry()">Clear</button>
      <button class="btn-save" onclick="saveSheet()">Save</button>
    </div>
  </div>
</div>

<script>
  let records = {};
  let masterRate = 70;

  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth();
  let selectedDate = null;
  let isLunch = false;
  let isDinner = false;

  window.onload = function() {
    loadServerData();
  };

  function updateStatus(online, msg) {
    const dot = document.getElementById("serverDot");
    const txt = document.getElementById("serverText");
    if (online) {
      dot.className = "status-dot online";
      txt.textContent = msg || "Server Synced";
    } else {
      dot.className = "status-dot";
      txt.textContent = msg || "Offline / Fallback";
    }
  }

  async function loadServerData() {
    try {
      const res = await fetch('/api/data');
      if (res.ok) {
        const json = await res.json();
        records = json.records || {};
        masterRate = json.masterRate !== undefined ? json.masterRate : 70;
        document.getElementById("masterRate").value = masterRate;
        updateStatus(true, "Server data.json Connected");
        render();
        return;
      }
    } catch (e) {
      console.warn("Server API unreachable, using LocalStorage fallback", e);
    }
    
    records = JSON.parse(localStorage.getItem("tiffin_records_data")) || {};
    masterRate = parseFloat(localStorage.getItem("tiffin_master_price")) || 70;
    document.getElementById("masterRate").value = masterRate;
    updateStatus(false, "Local Offline Mode");
    render();
  }

  async function syncToServer() {
    const payload = { masterRate, records };
    localStorage.setItem("tiffin_records_data", JSON.stringify(records));
    localStorage.setItem("tiffin_master_price", masterRate);

    try {
      const res = await fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        updateStatus(true, "Saved to data.json");
      } else {
        updateStatus(false, "Server Save Failed");
      }
    } catch (e) {
      updateStatus(false, "Saved Locally Only");
    }
  }

  function saveMasterRate() {
    const val = parseFloat(document.getElementById("masterRate").value);
    if (!isNaN(val) && val >= 0) {
      masterRate = val;
      syncToServer();
      render();
    }
  }

  function changeMonth(offset) {
    viewMonth += offset;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    else if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  }

  function resetToday() {
    viewYear = new Date().getFullYear();
    viewMonth = new Date().getMonth();
    render();
  }

  function getEntryExtras(entry) {
    if (!entry) return { total: 0, golu: 0 };
    if (Array.isArray(entry.extraItems) && entry.extraItems.length > 0) {
      let total = 0;
      let golu = 0;
      entry.extraItems.forEach(it => {
        const val = parseFloat(it.cost) || 0;
        total += val;
        if (it.isGolu) golu += val;
      });
      return { total, golu };
    }
    return { total: entry.extraCost || 0, golu: entry.goluCost || 0 };
  }

  function render() {
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    document.getElementById("monthTitle").textContent = months[viewMonth] + " " + viewYear;

    const grid = document.getElementById("daysGrid");
    grid.innerHTML = "";

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement("div");
      empty.className = "day-cell empty";
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const mStr = String(viewMonth + 1).padStart(2, "0");
      const dStr = String(d).padStart(2, "0");
      const dateKey = `${viewYear}-${mStr}-${dStr}`;

      const cell = document.createElement("div");
      cell.className = "day-cell";
      if (selectedDate === dateKey) cell.classList.add("selected");

      const entry = records[dateKey];
      let pills = "";
      let totalCost = 0;

      if (entry) {
        const count = (entry.lunch ? 1 : 0) + (entry.dinner ? 1 : 0);
        const rate = entry.rate !== undefined ? entry.rate : masterRate;
        const { total: extra, golu } = getEntryExtras(entry);
        totalCost = (count * rate) + extra;

        if (entry.lunch) pills += `<span class="dot-pill dot-l">L</span>`;
        if (entry.dinner) pills += `<span class="dot-pill dot-d">D</span>`;
        if (extra > 0) pills += `<span class="dot-pill dot-x">+${extra}</span>`;
        if (golu > 0) pills += `<span class="dot-pill dot-golu">Golu:${golu}</span>`;
      }

      cell.innerHTML = `
        <div class="day-top">
          <span class="day-num">${d}</span>
          ${totalCost > 0 ? `<span class="day-cost">₹${totalCost}</span>` : ""}
        </div>
        <div class="dots-row">${pills}</div>
      `;

      cell.onclick = () => openSheet(dateKey);
      grid.appendChild(cell);
    }

    calcKPIs();
  }

  function addExtraRow(name = "", cost = "", isGolu = false) {
    const container = document.getElementById("extrasList");
    const row = document.createElement("div");
    row.className = "extra-row";
    row.innerHTML = `
      <input type="text" class="extra-name" placeholder="Item (e.g. Milk, Water)" value="${name.replace(/"/g, '&quot;')}" />
      <input type="number" class="extra-val" placeholder="₹ Cost" value="${cost !== "" ? cost : ""}" min="0" />
      <button type="button" class="btn-golu-toggle ${isGolu ? 'active' : ''}" onclick="toggleGoluBtn(this)">Golu</button>
      <button type="button" class="btn-remove-row" onclick="this.parentElement.remove()">✕</button>
    `;
    container.appendChild(row);
  }

  function toggleGoluBtn(btn) {
    btn.classList.toggle("active");
  }

  function openSheet(dateKey) {
    selectedDate = dateKey;
    document.getElementById("sheetDateLabel").textContent = "Log: " + dateKey;

    const entry = records[dateKey];
    isLunch = entry ? !!entry.lunch : false;
    isDinner = entry ? !!entry.dinner : false;

    document.getElementById("inputRate").value = (entry && entry.rate !== undefined) ? entry.rate : "";
    
    const list = document.getElementById("extrasList");
    list.innerHTML = "";

    if (entry && Array.isArray(entry.extraItems) && entry.extraItems.length > 0) {
      entry.extraItems.forEach(item => {
        addExtraRow(item.name || "", item.cost !== undefined ? item.cost : "", !!item.isGolu);
      });
    } else if (entry && entry.extraCost > 0) {
      addExtraRow(entry.extraNote || "Extra", entry.extraCost, !!entry.isGolu);
    }

    updateToggleUI();
    document.getElementById("sheetOverlay").classList.add("active");
  }

  function closeSheet() {
    document.getElementById("sheetOverlay").classList.remove("active");
    selectedDate = null;
    render();
  }

  function overlayClick(e) {
    if (e.target.id === "sheetOverlay") closeSheet();
  }

  function toggleLunch() {
    isLunch = !isLunch;
    updateToggleUI();
  }

  function toggleDinner() {
    isDinner = !isDinner;
    updateToggleUI();
  }

  function updateToggleUI() {
    const bL = document.getElementById("btnLunch");
    const bD = document.getElementById("btnDinner");

    bL.className = "toggle-card" + (isLunch ? " active-l" : "");
    bL.textContent = "Lunch: " + (isLunch ? "✓ YES" : "OFF");

    bD.className = "toggle-card" + (isDinner ? " active-d" : "");
    bD.textContent = "Dinner: " + (isDinner ? "✓ YES" : "OFF");
  }

  function saveSheet() {
    if (!selectedDate) return;

    const rateVal = document.getElementById("inputRate").value;
    const rate = rateVal !== "" ? parseFloat(rateVal) : masterRate;

    const items = [];
    let totalExtras = 0;
    let totalGolu = 0;
    const rows = document.querySelectorAll("#extrasList .extra-row");

    rows.forEach(r => {
      const name = r.querySelector(".extra-name").value.trim();
      const val = parseFloat(r.querySelector(".extra-val").value);
      const isGolu = r.querySelector(".btn-golu-toggle").classList.contains("active");

      if (!isNaN(val) && val > 0) {
        items.push({ name: name || "Extra", cost: val, isGolu });
        totalExtras += val;
        if (isGolu) totalGolu += val;
      }
    });

    if (!isLunch && !isDinner && totalExtras <= 0) {
      delete records[selectedDate];
    } else {
      records[selectedDate] = {
        lunch: isLunch,
        dinner: isDinner,
        rate: isNaN(rate) ? masterRate : rate,
        extraItems: items,
        extraCost: totalExtras,
        goluCost: totalGolu
      };
    }

    syncToServer();
    closeSheet();
  }

  function clearEntry() {
    if (selectedDate && records[selectedDate]) {
      delete records[selectedDate];
      syncToServer();
    }
    closeSheet();
  }

  function calcKPIs() {
    let tiffinCost = 0;
    let tiffins = 0;
    let extras = 0;
    let goluSpend = 0;

    const prefix = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}`;

    Object.keys(records).forEach(k => {
      if (k.startsWith(prefix)) {
        const item = records[k];
        const count = (item.lunch ? 1 : 0) + (item.dinner ? 1 : 0);
        const rate = item.rate !== undefined ? item.rate : masterRate;
        const { total, golu } = getEntryExtras(item);

        tiffins += count;
        tiffinCost += (count * rate);
        extras += total;
        goluSpend += golu;
      }
    });

    document.getElementById("kpiTiffinCost").textContent = "₹" + tiffinCost;
    document.getElementById("kpiCount").textContent = tiffins;
    document.getElementById("kpiExtras").textContent = "₹" + extras;
    document.getElementById("kpiTotal").textContent = "₹" + (tiffinCost + extras);
    document.getElementById("kpiGolu").textContent = "₹" + goluSpend;
  }
</script>
</body>
</html>
